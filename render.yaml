services:
  - type: web
    name: smart-shopping
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_HEADLESS
        value: "true"
      - key: PUPPETEER_NO_SANDBOX
        value: "true"