<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>خرید هوشمند | مقایسه قیمت سبد خرید</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 🎯 نوار چسبان بالای صفحه -->
    <div id="sticky-header" class="sticky-header">
      <div class="sticky-header-inner">
        <div class="sticky-right">
          <div class="logo-mini">
            <span class="logo-mini-icon">🛒</span>
            <div class="logo-mini-text">
              <span class="logo-mini-title">خرید هوشمند</span>
              <span class="logo-mini-subtitle">مقایسه قیمت سبد خرید</span>
            </div>
          </div>
        </div>

        <div class="sticky-center">
          <!-- 🎯 ساعت و تاریخ شمسی -->
          <div class="sticky-datetime" id="sticky-datetime">
            <span class="datetime-date" id="datetime-date">—</span>
            <span class="datetime-time" id="datetime-time">—</span>
          </div>
          <!-- 🎯 قیمت دلار -->
          <div class="sticky-dollar" id="sticky-dollar">
            <span class="dollar-label">دلار</span>
            <span class="dollar-value" id="dollar-value">—</span>
          </div>
          <!-- 🎯 فیلتر ترتیب (کپی از پایین) -->
          <div class="sticky-sort hidden" id="sticky-sort">
            <span class="sort-toggle-label">اولویت نمایش فروشگاه‌ها:</span>
            <button class="sort-option" data-sort="price" type="button">
              کمترین قیمت
            </button>
            <button class="sort-option" data-sort="count" type="button">
              بیشترین موجودی
            </button>
          </div>
        </div>

        <div class="sticky-left">
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="تغییر حالت روشن/تاریک"
          >
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </div>
    </div>

    <div class="container">
      <!-- هدر اصلی -->
      <header class="header">
        <div class="logo">
          <span class="logo-icon">🛒</span>
          <div>
            <h1>خرید هوشمند</h1>
            <p class="subtitle">مقایسه قیمت سبد خرید در فروشگاه‌های آنلاین</p>
          </div>
        </div>
      </header>

      <!-- نوار اطلاعات بالای صفحه (تاریخ، ساعت، دلار) -->
      <div class="top-info-bar" id="top-info-bar">
        <div class="top-info-group">
          <div class="sticky-datetime" id="top-datetime">
            <span class="datetime-date" id="top-datetime-date">—</span>
            <span class="datetime-time" id="top-datetime-time">—</span>
          </div>
          <div class="sticky-dollar" id="top-dollar">
            <span class="dollar-label">دلار</span>
            <span class="dollar-value" id="top-dollar-value">—</span>
          </div>
          <div class="sort-inline hidden" id="top-sort">
            <span class="sort-toggle-label">اولویت نمایش فروشگاه‌ها:</span>
            <button class="sort-option" data-sort="price" type="button">
              کمترین قیمت
            </button>
            <button class="sort-option" data-sort="count" type="button">
              بیشترین موجودی
            </button>
          </div>
        </div>
        <button
          id="theme-toggle-top"
          class="theme-toggle-inline"
          aria-label="تغییر حالت"
        >
          <span class="theme-icon-top">🌙</span>
        </button>
      </div>

      <!-- نوار فروشگاه‌ها -->
      <section class="supported-stores">
        <div id="stores-strip" class="stores-strip"></div>
      </section>

      <!-- فرم ورودی -->
      <section class="input-section">
        <div class="input-header">
          <h2>📝 لیست خرید خود را وارد کنید</h2>
        </div>

        <div class="input-wrapper">
          <input
            type="text"
            id="item-input"
            placeholder="مثلاً: قلمو سرگرد پارس آرت شماره 4"
            autocomplete="off"
          />
          <button id="add-btn" class="btn-add">افزودن</button>
        </div>

        <div id="items-list" class="items-list"></div>

        <div class="actions">
          <button id="search-btn" class="btn-search" disabled>
            <span class="btn-search-idle" id="btn-search-idle">
              <span class="spinner" id="spinner"></span>
              <span id="search-btn-text">🔍 جستجو و مقایسه</span>
            </span>
            <span class="btn-search-active" id="btn-search-active">
              <span class="search-label">در حال جستجو</span>
              <span class="search-spinner"></span>
              <span class="slot slot-item" id="slot-item"
                ><span class="slot-text">—</span></span
              >
              <span class="search-label">در فروشگاه</span>
              <span class="slot slot-store" id="slot-store"
                ><span class="slot-text">—</span></span
              >
            </span>
          </button>
          <button id="clear-btn" class="btn-clear">پاک کردن همه</button>
        </div>
      </section>

      <!-- نتایج -->
      <section id="results-section" class="results-section hidden">
        <div id="stores-container" class="stores-container"></div>
      </section>

      <!-- خطا -->
      <div id="error-box" class="error-box hidden"></div>
    </div>

    <!-- دکمه شناور علاقه‌مندی‌ها -->
    <button
      id="wishlist-float-btn"
      class="wishlist-float-btn hidden"
      aria-label="علاقه‌مندی‌ها"
    >
      <span class="wishlist-float-icon">❤️</span>
      <span class="wishlist-float-count" id="wishlist-float-count">0</span>
    </button>

    <!-- مودال علاقه‌مندی‌ها -->
    <div id="wishlist-modal" class="wishlist-modal hidden">
      <div class="wishlist-modal-backdrop"></div>
      <div class="wishlist-modal-content">
        <div class="wishlist-modal-header">
          <div class="wishlist-modal-title">
            <span class="wishlist-modal-icon">❤️</span>
            <div>
              <div>علاقه‌مندی‌های من</div>
              <div class="wishlist-modal-date" id="wishlist-modal-date"></div>
            </div>
          </div>
          <button class="wishlist-modal-close" aria-label="بستن">✕</button>
        </div>
        <div class="wishlist-modal-total" id="wishlist-modal-total"></div>
        <div class="wishlist-modal-toolbar" id="wishlist-modal-toolbar">
          <button
            class="wishlist-tool-btn wishlist-tool-clear"
            id="wishlist-clear-all"
            type="button"
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="3 6 5 6 21 6"></polyline>
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              ></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <span>حذف همه</span>
          </button>
        </div>
        <div class="wishlist-modal-body" id="wishlist-modal-body"></div>
      </div>
    </div>

    <!-- دیالوگ تأیید -->
    <div id="confirm-dialog" class="confirm-dialog hidden">
      <div class="confirm-dialog-backdrop"></div>
      <div class="confirm-dialog-content">
        <div class="confirm-dialog-icon" id="confirm-dialog-icon">⚠️</div>
        <div class="confirm-dialog-title" id="confirm-dialog-title">
          تأیید عملیات
        </div>
        <div class="confirm-dialog-message" id="confirm-dialog-message"></div>
        <div class="confirm-dialog-actions">
          <button
            class="confirm-dialog-btn confirm-dialog-cancel"
            id="confirm-dialog-cancel"
            type="button"
          >
            انصراف
          </button>
          <button
            class="confirm-dialog-btn confirm-dialog-ok"
            id="confirm-dialog-ok"
            type="button"
          >
            تأیید
          </button>
        </div>
      </div>
    </div>

    <!-- مودال تصویر -->
    <div id="image-modal" class="image-modal hidden">
      <div class="image-modal-backdrop"></div>
      <button class="image-modal-close" aria-label="بستن">✕</button>
      <div class="image-modal-content">
        <img id="image-modal-img" src="" alt="" />
        <div class="image-modal-caption"></div>
      </div>
    </div>

    <!-- کانتینر اعلان‌ها -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
  </body>
</html>
